server {
    listen 80;
    server_name localhost;
    root /var/www/laravel/public;
    index index.php index.html;

    # Fix 413s (adjust as needed)
    client_max_body_size 50M;

    # Serve the Laravel public front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve /storage statically (via the public/storage symlink)
    # This removes ambiguity and avoids handing these to PHP
    location ^~ /storage/ {
        alias /var/www/laravel/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        # If your base image hardens symlinks, explicitly allow them:
        disable_symlinks off;
    }

    # PHP handling (safer: do not pass non-existent files to PHP)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # On many images, fastcgi.conf is preferred; fastcgi_params also works.
        include fastcgi_params;

        # Use realpath to avoid symlink edge-cases
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Hide .ht* files
    location ~ /\.ht {
        deny all;
    }
}