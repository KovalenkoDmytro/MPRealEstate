services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # Mount only public assets (optional for live reload)
      - ../laravel/public:/var/www/laravel/public:cached
    depends_on:
      - php
      - mysql

  php:
    build:
      context: ../laravel
      dockerfile: ../docker/dockerfiles/php.Dockerfile
    volumes:
      # Mount only editable folders
      - ../laravel/app:/var/www/laravel/app:cached
      - ../laravel/bootstrap:/var/www/laravel/bootstrap:cached
      - ../laravel/config:/var/www/laravel/config:cached
      - ../laravel/database:/var/www/laravel/database:cached
      - ../laravel/resources:/var/www/laravel/resources:cached
      - ../laravel/routes:/var/www/laravel/routes:cached
      - ../laravel/storage:/var/www/laravel/storage:cached
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.2.0
    ports:
      - "3316:3306"
    env_file:
      - "env/mysql.env"
    volumes:
      - "db_data:/var/lib/mysql"
  node:
    image: node:20
    working_dir: /var/www/laravel
    volumes:
      - ../laravel:/var/www/laravel
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
volumes:
  db_data:
