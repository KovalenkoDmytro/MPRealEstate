services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # Mount only public assets (optional for live reload)
      - ../laravel/public:/var/www/laravel/public:cached
      - ../laravel/storage/app/public:/var/www/laravel/storage/app/public:ro
    depends_on:
      - php
      - mysql

  php:
    build:
      context: ../laravel
      dockerfile: ../docker/dockerfiles/php.Dockerfile
    volumes:
      - ../laravel:/var/www/laravel:cached
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.2.0
    ports:
      - "3316:3306"
    env_file:
      - "env/mysql.env"
    volumes:
      - "db_data:/var/lib/mysql"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"      # expose for local tools; can remove in prod
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data:
