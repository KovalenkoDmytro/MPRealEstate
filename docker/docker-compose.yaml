name: mprealestate

services:
  nginx:
    image: nginx:stable-alpine
    container_name: mprealestate-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "../laravel/public:/var/www/laravel/public:cached"
      - "../laravel/storage/app/public:/var/www/laravel/storage/app/public:ro"
    depends_on:
      - php
      - mysql

  php:
    build:
      context: ../laravel
      dockerfile: ../docker/dockerfiles/php.Dockerfile
    container_name: mprealestate-php
    volumes:
      - "../laravel:/var/www/laravel:cached"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.2
    container_name: mprealestate-mysql
    ports:
      - "3316:3306"
    env_file:
      - "env/mysql.env"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: mprealestate-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
